version: "3.8"
services:
  tokenizer:
    image: tokenizer:1.0.0
    environment:
      PORT: 3002
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
    command: ["sh","-c","nuxt --port 3002 --module deepseek_tokenizer.py --workers 2"]
  keywords:
    image: keywords-filter:1.0.0
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    healthcheck:
      test: ["CMD","grpc_health_probe","-addr=:50051"]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: keywords-conf
        target: /app/config.yaml
      - source: keywords-dict
        target: /app/dict.txt
  sensitive:
    image: keywords-filter:1.0.0
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    entrypoint: ["./keywords-filter"]
    command: ["--config=config.yaml","--dict=dict.txt"]
    healthcheck:
      test: [ "CMD","grpc_health_probe","-addr=:50051" ]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: sensitive-conf
        target: /app/config.yaml
      - source: sensitive-dict
        target: /app/dict.txt
  ai-chat-service:
    image: ai-chat-service:1.0.0
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    entrypoint: [ "./ai-chat-service" ]
    command: [ "--config=config.yaml" ]
    healthcheck:
      test: [ "CMD","grpc_health_probe","-addr=:50051" ]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: ai-chat-service-conf
        target: /app/config.yaml
  ai-chat-backend:
    image: ai-chat-backend:1.0.0
    ports:
      - "7080:80"
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip
      update_config:
        parallelism: 2
        order: start-first
      rollback_config:
        parallelism: 2
        order: start-first
    entrypoint: [ "./ai-chat-backend" ]
    command: [ "--config=config.yaml" ]
    healthcheck:
      test: [ "CMD","curl","http://localhost/api/health" ]
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 1s
    configs:
      - source: ai-chat-backend-conf
        target: /app/config.yaml
configs:
  keywords-conf:
    file: ./configs/keywords.yaml
  keywords-dict:
    file: ./configs/keywords-dict.txt
  sensitive-conf:
    file: ./configs/sensitive.yaml
  sensitive-dict:
    file: ./configs/sensitive-dict.txt
  ai-chat-service-conf:
    file: ./configs/ai-chat-service.yaml
  ai-chat-backend-conf:
    file: ./configs/ai-chat-backend.yaml
