server:
  ip: 0.0.0.0
  port: 50055
  accessToken: "me256487ang1chubdpdialoud22sev1ozhoguumyqca"
log:
  # panic,fatal,error,warn,warning,info,debug,trace
  level: "info"
  logPath: "runtime/logs/app.log"
chat:
  # openai key
  api_key: "i0jey84SdkFdw5u43780yjr3h7se8nth0yi295nr94ksDngKprEh"
  # openai 接口地址
  base_url: "http://localhost:8084/v1"
  # 使用的训练模型
  model: "deepseek-v4-pro"
  # 单次请求的上下文总长度,包括：请求消息+响应消息
  max_tokens: 8192
  # 表示语言模型输出的随机性和创造性
  # 取值范围 0 ~ 1，值越大随机性越高
  temperature: 0.8
  # 用于生成文本时控制选词的随机程度
  # 即下一个预测单词考虑的概率范围
  # 取值范围0 ~ 1
  top_p: 0.9
  # 存在惩罚，用于生成文本时控制重复使用单词的程度
  # 取值范围 0 ~ 1 ，0表示不惩罚，1表示禁止重复
  presence_penalty: 0.8
  # 用于控制模型生成回复时重复单词出现的频率
  # 取值范围 0~1，值越大表示回复时会更注重避免使用已经出现的单词
  frequency_penalty: 0.5
  # AI助手特征描述
  bot_desc: "你是一个AI助手，我需要你模拟一名资深的软件工程师来回答我的问题"
  # 单次请求，保留的响应tokens数量
  min_response_tokens: 2048
  # 上下文消息条数
  context_len: 4
  # 控制思考模式与非思考模式的转换：如果设为 enabled，则使用思考模式。如果设为 disabled，则使用非思考模式
  thinking_type: disabled
  #控制模型的推理强度[low, high, max]
  reasoning_effort: low
dependOn:
  sensitive:
    address: "localhost:50053"
  tokenizer:
    address: "http://192.168.184.138:3002"
